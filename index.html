<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHARAMIN App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* ۱. حل مشکل فیکس نشدن تصویر در موبایل */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #000; /* رنگ رزرو در صورت لود نشدن عکس */
        }

        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* لینک مستقیم و پایدار برای اطمینان از لود شدن در موبایل */
            background-image: url('https://raw.githubusercontent.com/MASIHSATAN/File-Links/main/vector-4.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
        }

        /* لایه تیره کننده روی پس‌زمینه */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); 
            z-index: -1;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: white;
        }

        h1 {
            margin-top: 40px;
            font-size: 32px;
            letter-spacing: 3px;
            text-shadow: 0px 4px 10px rgba(0,0,0,0.8);
            font-weight: 900;
        }

        .container {
            width: 85%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
            padding-bottom: 50px;
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 20px;
            color: white;
            text-decoration: none;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .glass-btn:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="bg-container"></div>
    <div class="overlay"></div>

    <h1>SHARAMIN</h1>

    <div class="container">
        <a href="https://wallet.tonkeeper.com/" class="glass-btn">Wallet</a>
        <a href="https://t.me/cryptorank_app_bot/points?startapp=ref_6063078504_" class="glass-btn">AirDrop</a>
        <a href="https://sharamin.blogspot.com/" class="glass-btn">Blog</a>
        <a href="https://t.me/+3egWw_3r9fAyOGNk" class="glass-btn">Group</a>
        <a href="https://t.me/notcoin_bot?start=er_25778939" class="glass-btn">Nothing</a>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // حل مشکل باز نشدن لینک‌ها در برخی نسخه‌های موبایل
        document.querySelectorAll('.glass-btn').forEach(button => {
            button.onclick = function(e) {
                e.preventDefault();
                tg.openLink(this.href);
            }
        });
    </script>
</body>
</html>
