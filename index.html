<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHARAMIN App</title>
    <!-- Telegram WebApp Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Lucide Icons for better visuals -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-color: #ffffff;
            --accent-color: #00d2ff;
            --hover-bg: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-color);
            background: #0f172a; /* Fallback dark blue */
            /* Gradient background inspired by the universe */
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            overflow-x: hidden;
            padding-top: 40px;
        }

        /* پس‌زمینه متحرک ظریف */
        .bg-glow {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://github.com/MASIHSATAN/-/blob/main/vector-4.png?raw=true') no-repeat center center fixed;
            opacity: 0.3;
            z-index: -1;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            margin: 0;
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
            background: linear-gradient(to bottom, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 5px;
            letter-spacing: 2px;
        }

        .container {
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            animation: fadeInUp 1s ease-out;
        }

        .glass-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 18px 25px;
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .glass-btn i {
            width: 24px;
            height: 24px;
            color: var(--accent-color);
        }

        .glass-btn:active {
            transform: scale(0.96);
            background: var(--hover-bg);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* انیمیشن‌ها */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* پانویس */
        footer {
            margin-top: auto;
            padding: 30px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <header>
        <h1>SHARAMIN</h1>
        <div class="subtitle">Ecosystem of Future</div>
    </header>

    <div class="container">
        <a href="https://wallet.tonkeeper.com/" class="glass-btn">
            <div class="btn-content">
                <i data-lucide="wallet"></i>
                <span>کیف پول (Wallet)</span>
            </div>
            <i data-lucide="chevron-left"></i>
        </a>

        <a href="https://t.me/cryptorank_app_bot/points?startapp=ref_6063078504_" class="glass-btn">
            <div class="btn-content">
                <i data-lucide="coins"></i>
                <span>ایردراپ (AirDrop)</span>
            </div>
            <i data-lucide="chevron-left"></i>
        </a>

        <a href="https://sharamin.blogspot.com/" class="glass-btn">
            <div class="btn-content">
                <i data-lucide="book-open"></i>
                <span>وبلاگ (Blog)</span>
            </div>
            <i data-lucide="chevron-left"></i>
        </a>

        <a href="https://t.me/+3egWw_3r9fAyOGNk" class="glass-btn">
            <div class="btn-content">
                <i data-lucide="users"></i>
                <span>گروه (Group)</span>
            </div>
            <i data-lucide="chevron-left"></i>
        </a>

        <a href="https://t.me/notcoin_bot?start=er_25778939" class="glass-btn">
            <div class="btn-content">
                <i data-lucide="sparkles"></i>
                <span>هیچی (Nothing)</span>
            </div>
            <i data-lucide="chevron-left"></i>
        </a>
    </div>

    <footer>
        &copy; 2024 SHARAMIN App
    </footer>

    <script>
        // Initialize Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        // Theme configuration
        tg.setHeaderColor('#0f172a');
        tg.setBackgroundColor('#0f172a');

        // Initialize Lucide icons
        lucide.createIcons();

        // Handle link clicks with Telegram safe method
        document.querySelectorAll('.glass-btn').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const url = this.getAttribute('href');
                if (url) {
                    // Feedback effect
                    if (tg.HapticFeedback) {
                        tg.HapticFeedback.impactOccurred('light');
                    }
                    tg.openLink(url);
                }
            });
        });

        // Set Main Button (Optional example)
        tg.MainButton.setText("بستن برنامه");
        tg.MainButton.hide(); 
    </script>
</body>
</html>
