<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHARAMIN App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        body {
            /* ۱. تنظیم تصویر پس‌زمینه */
            background-image: url('vector-4.png'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            padding: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        /* لایه تیره کننده روی پس‌زمینه برای خوانایی بیشتر */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4); /* میزان تیرگی */
            z-index: -1;
        }

        h1 {
            color: white;
            margin-top: 20px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        /* ۲. دکمه‌های شیشه‌ای و شفاف */
        .glass-btn {
            background: rgba(255, 255, 255, 0.1); /* شفافیت سفید */
            backdrop-filter: blur(10px); /* افکت مات کردن پشت دکمه */
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 18px;
            color: white;
            text-decoration: none;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .glass-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <h1>SHARAMIN</h1>

    <div class="container">
        <a href="https://wallet.tonkeeper.com/" class="glass-btn">Wallet</a>
        <a href="https://t.me/cryptorank_app_bot/points?startapp=ref_6063078504_" class="glass-btn">AirDrop</a>
        <a href="https://sharamin.blogspot.com/" class="glass-btn">Blog</a>
        <a href="https://t.me/+3egWw_3r9fAyOGNk" class="glass-btn">Group</a>
        <a href="https://t.me/notcoin_bot?start=er_25778939" class="glass-btn">Nothing</a>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
    </script>
</body>
</html>
