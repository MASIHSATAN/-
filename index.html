<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHARAMIN App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    color: white;
    background-color: #000000; /* رنگ رزرو اگر عکس لود نشد */
    background-image: url('vector-4.png');
    /* دستور اصلی پس‌زمینه */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

        /* لایه تیره کننده برای خوانایی دکمه‌ها */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: -1;
        }

        h1 {
            margin-top: 0;
            letter-spacing: 3px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
            font-size: 2.5rem;
        }

        .container {
            width: 85%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 18px;
            color: white;
            text-decoration: none;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .glass-btn:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <h1>SHARAMIN</h1>

    <div class="container">
        <a href="https://wallet.tonkeeper.com/" class="glass-btn">Wallet</a>
        <a href="https://t.me/cryptorank_app_bot/points?startapp=ref_6063078504_" class="glass-btn">AirDrop</a>
        <a href="https://sharamin.blogspot.com/" class="glass-btn">Blog</a>
        <a href="https://t.me/+3egWw_3r9fAyOGNk" class="glass-btn">Group</a>
        <a href="https://t.me/notcoin_bot?start=er_25778939" class="glass-btn">Nothing</a>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        tg.setBackgroundColor('#000000');
        tg.setHeaderColor('#000000');

        document.querySelectorAll('.glass-btn').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                tg.openLink(this.getAttribute('href'));
            });
        });
    </script>
</body>
</html>
