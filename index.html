<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHARAMIN App</title>
    <!-- اضافه کردن فونت‌های مورد نیاز -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Graduate&family=Special+Elite&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
            --accent-color: #00d2ff;
            --ai-accent: #8b5cf6;
            --gold-gradient: linear-gradient(
                to bottom,
                #fcf6ba 0%,
                #bf953f 22%,
                #fbf5b7 45%,
                #aa771c 50%,
                #fcf6ba 100%
            );
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: var(--text-color);
            background-image: url('https://github.com/MASIHSATAN/-/blob/main/vector-4.png?raw=true');
            background-position: center center;
            background-repeat: no-repeat;
            background-size: 80%;
            background-attachment: fixed;
            padding-top: 15px;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: -1;
        }

        /* نوار وضعیت بالا - فونت Graduate (فوتبال آمریکایی) */
        .top-bar {
            width: 92%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            margin-bottom: 25px;
            color: rgba(255, 255, 255, 0.9);
            direction: ltr;
            font-family: 'Graduate', serif;
        }

        .live-clock {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.15rem;
        }

        #time-string {
            color: #ffd700;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
        }

        .utc-tag {
            font-size: 0.7rem;
            color: var(--ai-accent);
            border-left: 1px solid var(--glass-border);
            padding-left: 12px;
        }

        #date-display {
            font-size: 0.75rem;
            opacity: 0.8;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
            z-index: 1;
        }

        /* عنوان اصلی - فونت Dancing Script (چسبیده حرفه‌ای) */
        h1 {
            margin: 0;
            font-family: 'Dancing Script', cursive;
            font-size: 4.5rem;
            font-weight: 700;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 5px 8px rgba(0,0,0,0.5));
            animation: gold-shimmer 5s infinite linear;
            background-size: 200% auto;
            padding: 0 15px;
        }

        @keyframes gold-shimmer {
            to { background-position: 200% center; }
        }

        .container {
            width: 88%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 1;
        }

        /* دکمه‌ها - فونت Special Elite (ماشین‌تحریر قدیمی آمریکایی) */
        .glass-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 14px 22px;
            color: white;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .ai-special {
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.4);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.25);
        }

        .btn-right-icon { 
            order: 1; 
            display: flex; 
            align-items: center; 
            color: rgba(255,255,255,0.7);
        }
        
        .btn-left-text { 
            order: 2; 
            font-size: 1.1rem; 
            font-family: 'Special Elite', cursive; /* فونت قدیمی آمریکایی */
            letter-spacing: 1px;
        }

        .glass-btn:active { 
            transform: scale(0.95) translateY(2px); 
            background: rgba(255, 255, 255, 0.15); 
        }

        .glass-btn:hover {
            border-color: rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.12);
        }

        /* AI Chat UI */
        #ai-chat-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            flex-direction: column;
            padding: 20px;
            backdrop-filter: blur(20px);
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 15px;
        }

        .chat-header h3 {
            margin: 0;
            font-family: 'Special Elite', cursive;
            font-size: 1.2rem;
            color: var(--ai-accent);
        }

        #chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            padding: 5px;
        }

        .message { 
            max-width: 85%; 
            padding: 12px 18px; 
            border-radius: 18px; 
            font-size: 0.95rem; 
            line-height: 1.6;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        
        .user-message { 
            align-self: flex-start; 
            background: rgba(255,255,255,0.06); 
            border: 1px solid var(--glass-border); 
            border-bottom-left-radius: 2px; 
        }
        
        .ai-message { 
            align-self: flex-end; 
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.25), rgba(139, 92, 246, 0.1)); 
            border: 1px solid rgba(139, 92, 246, 0.4); 
            border-bottom-right-radius: 2px; 
            color: #eee; 
            direction: rtl; 
        }

        .chat-input-container { 
            display: flex; 
            gap: 12px; 
            background: rgba(255,255,255,0.05); 
            padding: 10px; 
            border-radius: 25px; 
            border: 1px solid var(--glass-border); 
        }
        
        #user-input { 
            flex-grow: 1; 
            background: transparent; 
            border: none; 
            padding: 5px 15px; 
            color: white; 
            outline: none; 
            font-size: 0.95rem; 
        }
        
        .send-btn { 
            background: var(--ai-accent); 
            border: none; 
            border-radius: 50%; 
            width: 42px; 
            height: 42px; 
            color: white; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: 0.3s; 
        }

        footer { 
            margin-top: auto; 
            padding: 30px; 
            font-size: 0.8rem; 
            opacity: 0.4; 
            z-index: 1; 
            letter-spacing: 2px; 
            font-family: 'Special Elite', cursive;
        }
        
        .loading-dots:after { content: ' .'; animation: dots 1s steps(5, end) infinite; }
        @keyframes dots {
            0%, 20% { color: rgba(0,0,0,0); text-shadow: .5em 0 0 rgba(0,0,0,0), 1em 0 0 rgba(0,0,0,0); }
            40% { color: white; text-shadow: .5em 0 0 rgba(0,0,0,0), 1em 0 0 rgba(0,0,0,0); }
            60% { text-shadow: .5em 0 0 white, 1em 0 0 rgba(0,0,0,0); }
            80%, 100% { text-shadow: .5em 0 0 white, 1em 0 0 white; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="live-clock" id="clock-display">
            <span id="time-string">00:00:00</span>
            <span class="utc-tag">UTC</span>
        </div>
        <div id="date-display">...</div>
    </div>

    <header>
        <h1>Sharamin</h1>
    </header>

    <div class="container">
        <div id="ai-trigger" class="glass-btn ai-special">
            <div class="btn-right-icon">
                <i data-lucide="sparkles"></i>
            </div>
            <div class="btn-left-text">AI Assistant</div>
        </div>

        <a href="https://wallet.tonkeeper.com/" class="glass-btn">
            <div class="btn-right-icon">
                <i data-lucide="wallet"></i>
            </div>
            <div class="btn-left-text">Wallet</div>
        </a>

        <a href="https://t.me/cryptorank_app_bot/points?startapp=ref_6063078504_" class="glass-btn">
            <div class="btn-right-icon">
                <i data-lucide="coins"></i>
            </div>
            <div class="btn-left-text">AirDrop</div>
        </a>

        <a href="https://sharamin.blogspot.com/" class="glass-btn">
            <div class="btn-right-icon">
                <i data-lucide="layout"></i>
            </div>
            <div class="btn-left-text">Journal</div>
        </a>

        <a href="https://t.me/+3egWw_3r9fAyOGNk" class="glass-btn">
            <div class="btn-right-icon">
                <i data-lucide="users"></i>
            </div>
            <div class="btn-left-text">Society</div>
        </a>

        <a href="https://t.me/notcoin_bot?start=er_25778939" class="glass-btn">
            <div class="btn-right-icon">
                <i data-lucide="star"></i>
            </div>
            <div class="btn-left-text">Legacy</div>
        </a>
    </div>

    <div id="ai-chat-modal">
        <div class="chat-header">
            <h3>✨ THE SHARAMIN INTELLIGENCE</h3>
            <button id="close-chat" style="background:none; border:none; color:white; cursor:pointer;"><i data-lucide="x"></i></button>
        </div>
        <div id="chat-messages">
            <div class="message ai-message">سلام! من هوش مصنوعی شرامین هستم. چطور می‌توانم در دنیای کریپتو به شما کمک کنم؟</div>
        </div>
        <div class="chat-input-container">
            <input type="text" id="user-input" placeholder="سوال خود را بپرسید..." autocomplete="off">
            <button class="send-btn" id="send-btn"><i data-lucide="send"></i></button>
        </div>
    </div>

    <footer>
        EST. 2021 | SHARAMIN PROJECT
    </footer>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        lucide.createIcons();

        function updateLiveInfo() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('date-display').textContent = now.toLocaleDateString('en-US', options);

            const hours = String(now.getUTCHours()).padStart(2, '0');
            const minutes = String(now.getUTCMinutes()).padStart(2, '0');
            const seconds = String(now.getUTCSeconds()).padStart(2, '0');
            document.getElementById('time-string').textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateLiveInfo, 1000);
        updateLiveInfo();

        const apiKey = "";
        const aiModal = document.getElementById('ai-chat-modal');
        const aiTrigger = document.getElementById('ai-trigger');
        const closeChat = document.getElementById('close-chat');
        const sendBtn = document.getElementById('send-btn');
        const userInput = document.getElementById('user-input');
        const chatMessages = document.getElementById('chat-messages');

        aiTrigger.addEventListener('click', () => {
            aiModal.style.display = 'flex';
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        });

        closeChat.addEventListener('click', () => {
            aiModal.style.display = 'none';
        });

        async function callGemini(prompt) {
            const systemPrompt = "You are the Sharamin Smart Assistant, an expert in cryptocurrency and TON blockchain. Respond in Persian.";
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    })
                });
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "متأسفانه پاسخی دریافت نشد.";
            } catch (e) { return "خطا در برقراری ارتباط با هوش مصنوعی."; }
        }

        async function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            addMessage(text, 'user');
            userInput.value = '';
            
            const loadingId = 'loading-' + Date.now();
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message ai-message loading-dots';
            loadingDiv.id = loadingId;
            loadingDiv.innerText = 'در حال بررسی';
            chatMessages.appendChild(loadingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            const response = await callGemini(text);
            const loader = document.getElementById(loadingId);
            if(loader) loader.remove();
            addMessage(response, 'ai');
        }

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}-message`;
            msgDiv.innerText = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        sendBtn.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') handleSendMessage(); });

        document.querySelectorAll('.glass-btn:not(.ai-special)').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const url = this.getAttribute('href');
                if (url) {
                    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                    tg.openLink(url);
                }
            });
        });
    </script>
</body>
</html>
