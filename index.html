<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHARAMIN App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
        }

        .bg-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            /* استفاده از آدرس مستقیم برای رفع مشکل لود نشدن */
            background-image: url('https://raw.githubusercontent.com/MASIHSATAN/-/main/vector-4.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); 
            z-index: -1;
        }

        .app-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: white;
            font-family: sans-serif;
        }

        h1 {
            margin-top: 50px;
            font-size: 32px;
            letter-spacing: 4px;
            text-shadow: 0px 4px 10px rgba(0,0,0,0.8);
        }

        .container {
            width: 85%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            color: white;
            text-decoration: none;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .glass-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="bg-container"></div>
    <div class="overlay"></div>

    <div class="app-content">
        <h1>SHARAMIN</h1>

        <div class="container">
            <a href="https://wallet.tonkeeper.com/" class="glass-btn">Wallet</a>
            <a href="https://t.me/cryptorank_app_bot/points?startapp=ref_6063078504_" class="glass-btn">AirDrop</a>
            <a href="https://sharamin.blogspot.com/" class="glass-btn">Blog</a>
            <a href="https://t.me/+3egWw_3r9fAyOGNk" class="glass-btn">Group</a>
            <a href="https://t.me/notcoin_bot?start=er_25778939" class="glass-btn">Nothing</a>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        document.querySelectorAll('.glass-btn').forEach(button => {
            button.onclick = function(e) {
                e.preventDefault();
                tg.openLink(this.href);
            }
        });
    </script>
</body>
</html>
