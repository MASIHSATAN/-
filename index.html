<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHARAMIN App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
            --accent-color: #00d2ff;
            --ai-accent: #8b5cf6;
            --gold-light: #fdfc47;
            --gold-mid: #ffd700;
            --gold-dark: #b8860b;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Tahoma, sans-serif;
            color: var(--text-color);
            background-image: url('https://github.com/MASIHSATAN/-/blob/main/vector-4.png?raw=true');
            background-position: center center;
            background-repeat: no-repeat;
            background-size: 80%;
            background-attachment: fixed;
            padding-top: 20px;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: -1;
        }

        /* نوار وضعیت بالا */
        .top-bar {
            width: 92%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            border-radius: 12px;
            margin-bottom: 30px;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.8);
            direction: ltr; /* برای نمایش صحیح تاریخ و ساعت انگلیسی */
        }

        .live-clock {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .utc-tag {
            background: var(--ai-accent);
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: bold;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
            z-index: 1;
        }

        h1 {
            margin: 0;
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 6px;
            text-transform: uppercase;
            background: linear-gradient(
                to bottom,
                #fcf6ba 0%,
                #bf953f 22%,
                #fbf5b7 45%,
                #aa771c 50%,
                #fcf6ba 100%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            animation: gold-shimmer 3s infinite linear;
            background-size: 200% auto;
        }

        @keyframes gold-shimmer {
            to { background-position: 200% center; }
        }

        .container {
            width: 88%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1;
        }

        .glass-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 16px 20px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.2s, background 0.2s;
            cursor: pointer;
        }

        .ai-special {
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(139, 92, 246, 0.4);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
        }

        .btn-right-icon { order: 1; display: flex; align-items: center; }
        .btn-left-text { order: 2; font-size: 0.95rem; opacity: 0.9; font-family: sans-serif; }

        .glass-btn:active { transform: scale(0.97); background: rgba(255, 255, 255, 0.2); }

        /* AI Chat UI */
        #ai-chat-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            flex-direction: column;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        #chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            padding: 10px;
        }

        .message { max-width: 85%; padding: 12px 16px; border-radius: 15px; font-size: 0.95rem; line-height: 1.5; }
        .user-message { align-self: flex-start; background: var(--glass-bg); border: 1px solid var(--glass-border); }
        .ai-message { align-self: flex-end; background: rgba(139, 92, 246, 0.3); border: 1px solid rgba(139, 92, 246, 0.5); color: #fff; direction: rtl; }

        .chat-input-container { display: flex; gap: 10px; }
        #user-input { flex-grow: 1; background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); border-radius: 12px; padding: 12px; color: white; outline: none; }
        .send-btn { background: var(--ai-accent); border: none; border-radius: 12px; padding: 0 15px; color: white; cursor: pointer; }

        footer { margin-top: auto; padding: 25px; font-size: 0.8rem; opacity: 0.6; z-index: 1; }
        
        .loading-dots:after { content: ' .'; animation: dots 1s steps(5, end) infinite; }
        @keyframes dots {
            0%, 20% { color: rgba(0,0,0,0); text-shadow: .5em 0 0 rgba(0,0,0,0), 1em 0 0 rgba(0,0,0,0); }
            40% { color: white; text-shadow: .5em 0 0 rgba(0,0,0,0), 1em 0 0 rgba(0,0,0,0); }
            60% { text-shadow: .5em 0 0 white, 1em 0 0 rgba(0,0,0,0); }
            80%, 100% { text-shadow: .5em 0 0 white, 1em 0 0 white; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="live-clock" id="clock-display">
            <span id="time-string">00:00:00</span>
            <span class="utc-tag">UTC</span>
        </div>
        <div id="date-display">Friday, Dec 19, 2025</div>
    </div>

    <header>
        <h1>SHARAMIN</h1>
    </header>

    <div class="container">
        <div id="ai-trigger" class="glass-btn ai-special">
            <div class="btn-right-icon">
                <i data-lucide="sparkles"></i>
            </div>
            <div class="btn-left-text">AI</div>
        </div>

        <a href="https://wallet.tonkeeper.com/" class="glass-btn">
            <div class="btn-right-icon">
                <i data-lucide="wallet"></i>
            </div>
            <div class="btn-left-text">Wallet</div>
        </a>

        <a href="https://t.me/cryptorank_app_bot/points?startapp=ref_6063078504_" class="glass-btn">
            <div class="btn-right-icon">
                <i data-lucide="coins"></i>
            </div>
            <div class="btn-left-text">AirDrop</div>
        </a>

        <a href="https://sharamin.blogspot.com/" class="glass-btn">
            <div class="btn-right-icon">
                <i data-lucide="layout"></i>
            </div>
            <div class="btn-left-text">Blog</div>
        </a>

        <a href="https://t.me/+3egWw_3r9fAyOGNk" class="glass-btn">
            <div class="btn-right-icon">
                <i data-lucide="users"></i>
            </div>
            <div class="btn-left-text">Group</div>
        </a>

        <a href="https://t.me/notcoin_bot?start=er_25778939" class="glass-btn">
            <div class="btn-right-icon">
                <i data-lucide="star"></i>
            </div>
            <div class="btn-left-text">Nothing</div>
        </a>
    </div>

    <div id="ai-chat-modal">
        <div class="chat-header">
            <h3>✨ مشاور هوشمند شرامین</h3>
            <button id="close-chat" style="background:none; border:none; color:white; cursor:pointer;"><i data-lucide="x"></i></button>
        </div>
        <div id="chat-messages">
            <div class="message ai-message">سلام! من هوش مصنوعی شرامین هستم. چطور می‌توانم در دنیای کریپتو به شما کمک کنم؟</div>
        </div>
        <div class="chat-input-container">
            <input type="text" id="user-input" placeholder="سوال خود را بپرسید..." autocomplete="off">
            <button class="send-btn" id="send-btn"><i data-lucide="send"></i></button>
        </div>
    </div>

    <footer>
        SHARAMIN Project &copy; 2021
    </footer>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        lucide.createIcons();

        // سیستم ساعت و تاریخ زنده
        function updateLiveInfo() {
            const now = new Date();
            
            // تنظیم تاریخ (سمت راست)
            const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('date-display').textContent = now.toLocaleDateString('en-US', options);

            // تنظیم ساعت UTC (سمت چپ)
            const hours = String(now.getUTCHours()).padStart(2, '0');
            const minutes = String(now.getUTCMinutes()).padStart(2, '0');
            const seconds = String(now.getUTCSeconds()).padStart(2, '0');
            document.getElementById('time-string').textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateLiveInfo, 1000);
        updateLiveInfo();

        // Gemini API configuration
        const apiKey = "";
        const aiModal = document.getElementById('ai-chat-modal');
        const aiTrigger = document.getElementById('ai-trigger');
        const closeChat = document.getElementById('close-chat');
        const sendBtn = document.getElementById('send-btn');
        const userInput = document.getElementById('user-input');
        const chatMessages = document.getElementById('chat-messages');

        aiTrigger.addEventListener('click', () => {
            aiModal.style.display = 'flex';
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        });

        closeChat.addEventListener('click', () => {
            aiModal.style.display = 'none';
        });

        async function callGemini(prompt) {
            const systemPrompt = "You are the Sharamin Smart Assistant, an expert in cryptocurrency and TON blockchain. Respond in Persian.";
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    })
                });
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "متأسفانه پاسخی دریافت نشد.";
            } catch (e) { return "خطا در برقراری ارتباط با هوش مصنوعی."; }
        }

        async function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            addMessage(text, 'user');
            userInput.value = '';
            
            const loadingId = 'loading-' + Date.now();
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message ai-message loading-dots';
            loadingDiv.id = loadingId;
            loadingDiv.innerText = 'در حال بررسی';
            chatMessages.appendChild(loadingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            const response = await callGemini(text);
            const loader = document.getElementById(loadingId);
            if(loader) loader.remove();
            addMessage(response, 'ai');
        }

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}-message`;
            msgDiv.innerText = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        sendBtn.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') handleSendMessage(); });

        document.querySelectorAll('.glass-btn:not(.ai-special)').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const url = this.getAttribute('href');
                if (url) {
                    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                    tg.openLink(url);
                }
            });
        });
    </script>
</body>
</html>
